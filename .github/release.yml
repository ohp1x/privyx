changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
      - question
  categories:
    - title: "💥 Breaking Changes"
      labels:
        - "breaking-change"
    - title: "✨ Features"
      labels:
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
    - title: "⚡ Performance"
      labels:
        - "performance"
    - title: "🔒 Security"
      labels:
        - "security"
    - title: "♻️ Refactoring"
      labels:
        - "refactor"
    - title: "📚 Documentation"
      labels:
        - "documentation"
    - title: "📦 Dependencies"
      labels:
        - "dependencies"
    - title: "Other Changes"
      labels:
        - "*"

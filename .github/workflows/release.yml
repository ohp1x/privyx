name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(uv run python -c 'from privyx.version import __version__; print(__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Determine if this is a pre-release (rc/alpha/beta/dev)
        id: check_prerelease
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -qE '(a|b|rc|alpha|beta|pre)[0-9]*$|\.?dev[0-9]*$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION looks like a pre-release; will publish a GitHub prerelease and SKIP the PyPI production publish job."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Extract changelog section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            /^\[[A-Za-z0-9._-]+\]:/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > changelog-excerpt.md
          echo "--- changelog-excerpt.md ---"
          cat changelog-excerpt.md

      - name: Generate PR-based release notes (categorized via .github/release.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            --jq .body > generated-notes.md
          echo "--- generated-notes.md ---"
          cat generated-notes.md

      - name: Assemble final release notes
        run: |
          {
            cat changelog-excerpt.md
            echo
            echo "---"
            echo
            cat generated-notes.md
          } > release-notes.md
          echo "--- release-notes.md (final) ---"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.check_prerelease.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            dist/*.whl dist/*.tar.gz

      - name: Upload build artifacts for PyPI publish
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # Safety gate: only real, stable releases reach production PyPI. A version
    # with a pre-release suffix (rc/alpha/beta/dev) only produces a GitHub
    # prerelease above; nothing is uploaded to PyPI for it. PyPI releases are
    # permanent (a version string can never be reused, even after deletion),
    # so this check exists specifically to prevent test/rc tags from leaking
    # into the production index.
    if: needs.build.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/privyx
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC), no API token stored
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-docker:
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner build the arm64 image (Apple Silicon, ARM
      # servers) alongside the native one.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: skipped until the DOCKERHUB_USERNAME repo
      # variable is set, so forks and unconfigured repos still publish to GHCR.
      # DOCKERHUB_NAMESPACE (an organization) defaults to that username; set it
      # when a member's personal token pushes to an organization's repository.
      - if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # vX.Y.Z -> X.Y.Z and X.Y; `latest` only for stable releases, so a
      # pre-release tag never moves what `docker pull` gives users by default.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}/privyx,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          flavor: latest=false
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.build.outputs.is_prerelease == 'false' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Docs

on:
  push:
    branches: [main]
    # examples/ and configs/ are embedded in the pages.
    paths: [docs/**, mkdocs.yml, examples/**, configs/**, .github/workflows/docs.yml]
  pull_request:
    # examples/ and configs/ are embedded in the pages.
    paths: [docs/**, mkdocs.yml, examples/**, configs/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --only-group docs --locked mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

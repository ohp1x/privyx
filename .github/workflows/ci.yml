name: CI

on:
  push:
    branches: [main]
    # Skip docs-only pushes, except the guide pages tests/unit/config/test_reference_docs.py reads.
    # pull_request stays unfiltered: `check` is a required status check.
    paths:
      - "**"
      - "!**.md"
      - "!mkdocs.yml"
      - docs/guide/configuration.md
      - docs/guide/cli.md
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, so a newly published advisory fails `vulns` without a push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # tests/integration/test_redis_vault.py runs against it; skipped without the URL.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      PRIVYX_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest --cov=privyx --cov-report=term

  # `check` runs on the .python-version above; requires-python allows newer too.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # presidio's spaCy has no build for Python 3.15 yet.
      - run: uv sync --all-extras --locked ${{ matrix.python == '3.15' && '--no-extra presidio' || '' }}
      - run: uv run pytest

  vulns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: make vulns

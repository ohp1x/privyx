[project]
name = "privyx"
version = "0.1.9"
description = "AI data privacy gateway: privacy engine + proxy for LLM providers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Privyx Contributors" }]
keywords = ["privacy", "proxy", "llm", "pseudonymization", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "click>=8.1",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20"]
redis = ["redis>=5.0"]
providers = ["openai>=1.30", "anthropic>=0.30"]
faker = ["faker>=25.0"]
presidio = ["presidio-analyzer>=2.2", "spacy>=3.6"]
crypto = ["cryptography>=42"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[dependency-groups]
# MkDocs 2.0 drops the plugin and theme system Material is built on.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.7"]

[project.urls]
Homepage = "https://github.com/ohp1x/privyx"
Documentation = "https://ohp1x.github.io/privyx/"
Repository = "https://github.com/ohp1x/privyx"
Changelog = "https://github.com/ohp1x/privyx/blob/main/CHANGELOG.md"
Issues = "https://github.com/ohp1x/privyx/issues"

[project.scripts]
privyx = "privyx.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privyx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

# Faker is an optional extra and ships no type information for our usage; keep it
# out of strict import checking so selecting the operator does not require stubs.
[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

# Presidio is an optional extra: absent locally, installed in CI (--all-extras).
# An inline `type: ignore` would be needed in the first case and flagged as
# unused in the second, so the exemption lives here instead.
[[tool.mypy.overrides]]
module = ["presidio_analyzer.*"]
ignore_missing_imports = true

# Example: custom provider endpoint
#
# Any endpoint that speaks the OpenAI or Anthropic chat format works: point a
# client at Privyx and it forwards to `base_url`.  Requests on the paths in
# `proxy.routes` are masked; other paths are forwarded as sent.

provider:
  type: generic
  base_url: http://localhost:20128    # any upstream endpoint
  api_key: ""
  headers:
    x-custom-header: "value"

vault:
  type: memory

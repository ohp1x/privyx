# Example: a router or other OpenAI/Anthropic-compatible endpoint
#
#   privyx -c configs/examples/custom.yaml proxy
#   privyx -c configs/examples/custom.yaml run --provider router claude
#
# The transparent proxy forwards to the origin of `base_url` and keeps the
# client's own path.  Requests on the paths in `proxy.routes` are masked.
# A `privyx run` profile uses its own provider unless --provider picks one;
# to send one profile there every time, set its `provider: router`
# (agents.yaml).

providers:
  router:
    base_url: https://router.example.com
    headers:
      x-custom-header: "value"   # sent with every request to the router, and nowhere else

provider: router

# Example: a proxy in front of Anthropic
#
#   privyx proxy -c configs/examples/anthropic.yaml
#   ANTHROPIC_BASE_URL=http://127.0.0.1:8000 claude    # or any Anthropic client
#
# `privyx run claude` needs no config for this: its profile picks Anthropic.

provider:
  type: anthropic          # https://api.anthropic.com; anthropic-version is added
  # Optional: set PRIVYX_ANTHROPIC_API_KEY to send this key instead of the
  # client's own.

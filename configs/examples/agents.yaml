# Example: agent profiles for `privyx run`
#
#   privyx run --list                    # every profile, built-in and yours
#   privyx run --dry-run claude:work     # what a launch would do, no secrets shown
#   privyx run claude:work
#
# Copy what you need into ~/.privyx/config.yaml.  Every value below is a
# placeholder.

# Files merged below this one, such as one file per machine.  A glob may match
# nothing.
include: ["privyx.d/*.yaml"]

agents:
  # claude:work inherits the built-in claude profile and changes where it goes.
  # The token is read from WORK_ANTHROPIC_TOKEN in your shell at launch; this
  # file holds only its name.
  claude:work:
    upstream: https://router.example.com
    env_from:
      ANTHROPIC_AUTH_TOKEN: WORK_ANTHROPIC_TOKEN

  # A second Codex home with its own login and config.toml.
  codex:work:
    env:
      CODEX_HOME: "${HOME}/.codex-work"

  # Privyx settings for one profile only, above config files and environment.
  claude:strict:
    presets: [strict]
    privyx:
      detector:
        terms:
          PERSON: [john smith, alice]
          ORGANIZATION: [acme]
    budget:
      max_turns: 200

# Privyx settings written once, for any profile (presets: [strict]) or one
# command (privyx run claude:work --preset debug, privyx proxy --preset
# strict).  A preset does nothing until one of those names it.
presets:
  strict:
    proxy:
      passthrough_unknown: false   # paths outside proxy.routes get 403
  debug:
    log_level: debug
    # At debug level this file holds vault rows with original values.
    log_file: "${HOME}/.privyx/debug.log"

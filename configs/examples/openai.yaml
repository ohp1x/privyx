# Example: a proxy in front of OpenAI
#
#   privyx proxy -c configs/examples/openai.yaml
#   OPENAI_BASE_URL=http://127.0.0.1:8000/v1 python app.py    # any OpenAI client
#
# `privyx run codex` needs no config for this: its profile picks OpenAI.

provider:
  type: openai             # https://api.openai.com
  # Optional: set PRIVYX_OPENAI_API_KEY to send this key instead of the
  # client's own.

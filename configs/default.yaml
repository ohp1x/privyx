# Privyx configuration template
#
# Every setting is listed with its default value, commented out, so loading
# this file as it is changes nothing.  Copy it to ~/.privyx/config.yaml (or a
# project's privyx.yaml) and uncomment only what you want to change.
#
# Precedence: defaults < global file < trusted project files < environment
# (PRIVYX_*) < CLI flags.  Reference docs: docs/guide/configuration.md.
#
# Any value may be ${NAME} or ${NAME:-fallback}, read from the environment.
# Credential settings (api_key, secret, headers, env, ...) may also name a
# 1Password item (op://vault/item/field) or a keychain entry
# (keychain://service/account, privyx[keychain]).  Keep API keys out of this file.

# --- Other files ---
# Files or globs merged below this one, relative to it.
# include: []

# --- Server and logging ---
# host: 127.0.0.1
# port: 8000
# log_level: info          # debug | info | warning | error
# logging: text            # console format: text | json
# Debug log file (or PRIVYX_LOG_FILE).  It also receives third-party logs at
# log_level.  At debug it holds raw vault rows (original values): it is
# created 0600, keep it local. On POSIX, existing files must belong to you
# with no permissions beyond 0600, or startup fails (fix with chmod 600).
# log_file: ""

# --- Upstream ---
# Explicit upstream, the same as --upstream or PRIVYX_UPSTREAM_URL.  Empty
# uses provider.base_url, then the default for provider.type.  In transparent
# `privyx run`, a native agent endpoint comes before that default.
# upstream_url: ""

# --- Agent launch profiles (`privyx run NAME`) ---
# Built-in profiles: claude, codex, openai, aider, pi, opencode, gemini, ollama,
# and grok.  Override them field by field, add your own with `extends`, or add
# a variant named base:variant (claude:work inherits claude).  Each profile
# can set command, provider, upstream, env_vars, base_path, extends, adapter,
# args, env, env_from, budget (max_turns, max_tokens), presets (names from
# presets below), and privyx (settings for that profile only).  See
# configs/examples/agents.yaml.
# agents:
#
# Named sets of Privyx settings, applied by an agent profile's presets list or
# by --preset NAME on any command.  A preset takes any setting but agents,
# presets, include, upstream_url, and provider.  Example:
# {strict: {proxy: {passthrough_unknown: false}}}
# presets: {}
#
# `privyx run`: also mask the workspace's git authors, remote owners, project
# names, .env values, and the local OS username, kept in memory (--harvest).
# OS usernames shorter than 3 characters and root/ubuntu/admin/user are skipped.
# harvest: false

# --- Provider ---
# Where requests go and which key they carry.  Leave type unset for
# `privyx run`: each agent profile picks its own provider.
#   URL  upstream_url, then provider.base_url, then the default for the type
#        (generic http://localhost:20128, openai api.openai.com,
#        anthropic api.anthropic.com, google generativelanguage.googleapis.com)
#   key  provider.<type>_api_key, then provider.api_key (or PRIVYX_<TYPE>_API_KEY,
#        PRIVYX_API_KEY); with neither the transparent proxy relays the client's own
# provider:
#   type: generic          # generic | openai | anthropic | google
#   base_url: ""
#   api_key: ""
#   openai_api_key: ""
#   anthropic_api_key: ""
#   google_api_key: ""
#   headers: {}            # extra headers on every upstream request

# --- Proxy ---
# proxy:
#   mode: transparent      # transparent | gateway
#   # Path -> wire schema of the requests Privyx masks.  A map given here
#   # replaces the 27 default paths (see docs/guide/proxy.md#routes).
#   routes:
#   passthrough_unknown: true   # false: paths not in routes get 403
#   forward_client_auth: true   # false: drop the client's key, send only provider's
#   timeout: 300           # seconds between bytes, read or write
#   connect_timeout: 10
#   max_connections: null  # null: no limit
#   dlp_check: false       # refuse a masked request that still holds a masked value
#   directive: false       # tell the model to keep placeholders as written
#   cache_control: false   # mark a large Anthropic tools/system prefix for caching

# --- TLS (HTTPS when certfile and keyfile are set) ---
# tls:
#   certfile: ""
#   keyfile: ""
#   keyfile_password: ""
#   ca_certs: ""

# --- Vault ---
# Where sessions and their mappings live.
# vault:
#   type: memory           # memory | sqlite (privyx[sqlite]) | redis (privyx[redis])
#   dsn: sqlite+aiosqlite:///~/.privyx/privyx.db
#   redis_url: redis://localhost:6379/0
#   ttl: null              # expire a session idle this many seconds; null keeps it

# --- Session ---
# How a request without an x-privyx-session header picks its session:
#   ephemeral     a fresh session per request
#   client        one session per client credential
#   conversation  one session per conversation (credential + first user message)
# `privyx run` uses conversation unless this is set.
# session:
#   strategy: ephemeral

# --- Detector ---
# What counts as sensitive.  One mapping, or a list of them whose findings are
# pooled.  The regex built-ins cover EMAIL, PHONE, CREDIT_CARD, IP_ADDRESS, SSN,
# API_KEY, JWT, PRIVATE_KEY, AUTH_TOKEN, URL_CREDENTIAL, and SECRET.
# detector:
#   type: regex            # regex | yaml | presidio (privyx[presidio]) | llm
#   # Entity -> regex, merged over the built-ins.  A (?P<value>...) group masks
#   # only that part.  Example, EMPLOYEE_ID: '\bEMP-\d{6}\b'
#   patterns: {}
#   # Entity -> literal strings, matched case-insensitively with word
#   # boundaries.  Example, PERSON: [ann, bob].  The same entity in patterns wins.
#   terms: {}
#   term_variants: false   # "Acme Corp" also matches acme-corp, acme_corp, ...
#   underscore_separates_words: false  # acme is found in ACME_API_KEY
#   # Entity -> words; a match counts only with one within five words.
#   context: {}
#   # Opt-in built-ins: CRYPTO_WALLET, ID_NIK, ID_NPWP, SG_NRIC_FIN, MY_NRIC,
#   # ES_NIF, ES_NIE, UK_NHS, IN_AADHAAR, HIGH_ENTROPY, ASSIGNED_SECRET, MRN, ICD10.
#   enable: []
#   disable: []            # built-in entities to turn off, such as CREDIT_CARD
#   entropy_threshold: 3.0 # HIGH_ENTROPY: bits per character
#   decode: false          # also scan split strings and Base64/hex/URL encoding
#   normalize: false       # also scan fullwidth and zero-width characters folded
#   cache:                 # or true / false
#     enabled: true
#     max_size: 10000
#   # presidio
#   language: en
#   model: ""              # spaCy model; empty: {language}_core_web_sm
#   entities: []           # empty: every recognizer
#   score_threshold: 0.35
#   # llm
#   llm_provider: openai   # openai | anthropic
#   llm_model: ""          # empty: a small default model per provider
#   llm_api_key: ""        # empty: the SDK's own environment variable
#   llm_instructions: ""   # empty: the built-in prompt
#   llm_timeout: 30.0
#   llm_max_chars: 4000
#   llm_fallback_on_error: false  # true: built-in patterns when the LLM fails

# --- Policy ---
# Which detections are masked: default masks all, strict only `allowed`.
# policy:
#   type: default          # default | strict
#   allowed: []            # strict: empty means every built-in entity

# --- Operator ---
# What a detected value becomes.  Every type but redact is restored in replies.
# operator:
#   type: pseudonym        # pseudonym | hash | encrypt | faker | fpe | partial | redact
#   token: "[REDACTED]"    # redact: replacement text
#   length: 12             # hash: digest characters kept
#   locale: ""             # faker: Faker locale, such as en_US
#   seed: null             # faker, fpe: same value, same fake across runs
#   key: ""                # encrypt: 64 hex chars (privyx[crypto]), or PRIVYX_ENCRYPT_KEY

# --- Anchor ---
# With a secret, the same value gets the same pseudonym in every session.
# Empty: a per-session counter.  `auto` creates or reuses ~/.privyx/anchor.key,
# which `privyx run` uses unless this is set.
# anchor:
#   type: hmac
#   secret: ""             # or PRIVYX_ANCHOR_SECRET; `openssl rand -hex 32`

# --- Token syntax ---
# The format must contain {type} and {id}; {namespace} is optional.  Two
# other formats: "[[{namespace}:{type}:{id}]]" and "<{namespace}:{type}:{id}>".
# token:
#   namespace: PRIVYX
#   format: "<{namespace}_{type}_{id}>"
#   compact: false         # short tokens such as <E~1>; format tokens still restore

# --- Audit ---
# PII-safe trail: entity types and counts, never content, as JSON lines.
# audit:
#   enabled: true
#   path: ~/.privyx/audit.log
#   tap: false             # each masked exchange before and after masking; holds originals
#   tap_dir: ~/.privyx/tap
#   # Model-id prefix -> USD per million tokens, for `privyx session show`.
#   # Example, claude-sonnet: {input: 3, output: 15}
#   prices: {}

# --- Tracing (OpenTelemetry, privyx[otel]; exporter set by OTEL_* variables) ---
# tracing:
#   enabled: false

# --- Plugins ---
# Directories or .py files whose components become selectable as a `type`.
# plugins:
#   enabled: true
#   paths: []

# Privyx default configuration
#
# Precedence: defaults < YAML file < environment variables

# --- Server ---
host: 127.0.0.1
port: 8000
log_level: info
logging: text

# --- Upstream provider ---
# Explicit override, equivalent to `--upstream` / PRIVYX_UPSTREAM_URL.  Leave
# it empty to use `provider.base_url` below, or — if that is empty too — the
# default endpoint for `provider.type`.
upstream_url: ""

# --- Vault ---
vault:
  type: memory          # memory | sqlite | redis
  dsn: sqlite+aiosqlite:///privyx.db
  redis_url: redis://localhost:6379/0

# --- Detector ---
# Omit `patterns` to use the built-in set (EMAIL, PHONE, CREDIT_CARD,
# IP_ADDRESS, SSN).  Any patterns listed here are merged over the built-ins,
# so you only need to name the ones you want to override or add.
#
# `terms` is the same idea for literal strings: give it a list and Privyx
# escapes each one, orders the longest first, and adds word boundaries for you.
# Matching is case-insensitive (`patterns` regexes stay case-sensitive).  The
# entity name is whatever you write — it is the {type} in the token, so it must
# start with a letter and contain only letters, digits, or underscores.
#
# `terms` and `patterns` can both be set; they are merged.  If the same entity
# appears in both, the hand-written `patterns` regex wins.
#
# Note: with `policy.type: strict`, any entity you add here must also be listed
# in `policy.allowed` or it will be detected and then silently dropped.
detector:
  type: regex
  patterns: {}
  terms: {}
  # terms:
  #   PERSON:       [ann, bob]
  #   ORGANIZATION: [acme, initech]
  #   URL:          ["https://git.internal.example/team"]

# --- Policy ---
policy:
  type: default          # default | strict
  # allowed: [EMAIL, PHONE, SSN]

# --- Operator ---
# `pseudonym` and `hash` are reversible through the session vault; `redact`
# destroys the original, so responses referring to a redacted value cannot be
# restored.
operator:
  type: pseudonym        # pseudonym | redact | hash
  # token: "[REDACTED]"  # redact: replacement text
  # length: 12           # hash: digest length

# --- Anchor ---
# With a secret set, pseudonyms are derived from the value itself, so the same
# input gets the same pseudonym in every session.  Empty (the default) means no
# anchoring at all — per-session counters — rather than anchoring with a
# guessable key.  Only the `pseudonym` operator uses this.
anchor:
  type: hmac             # hmac
  secret: ""             # set via PRIVYX_ANCHOR_SECRET, or `openssl rand -hex 32`

# --- Session ---
# How a session is identified when the client sends no `x-privyx-session` header
# (Claude Code, codex, aider, ... never do).  An explicit header always wins.
#   ephemeral    — a fresh session per request (default; safe, but a multi-turn
#                  conversation is re-tokenized each turn and shows as many sessions)
#   client       — one reused session per client credential (Authorization/x-api-key)
#   conversation — one reused session per conversation (credential + first user
#                  message); different conversations stay isolated
# `privyx run` defaults this to `conversation`.  See PRIVYX_SESSION_STRATEGY and
# docs/architecture/proxy.md.
session:
  strategy: ephemeral    # ephemeral | client | conversation

# --- Token syntax ---
# How placeholder tokens look in text.  Purely a serialization choice: the
# privacy engine, detectors, policies, proxy, and storage never see it.
# `format` must contain {type} and {id}; {namespace} is optional; adjacent
# fields need a delimiter between them.
token:
  namespace: PRIVYX
  format: "<{namespace}_{type}_{id}>"   # -> <PRIVYX_EMAIL_1>
  # Alternatives (change without touching any code):
  # format: "[[{namespace}:{type}:{id}]]"  # -> [[PRIVYX:EMAIL:1]]
  # format: "<{namespace}:{type}:{id}>"    # -> <PRIVYX:EMAIL:1>

# --- Provider ---
# Resolution order for the upstream URL:
#   upstream_url  →  provider.base_url  →  the default for provider.type
provider:
  type: generic          # generic | openai | anthropic
  base_url: ""           # empty → http://localhost:20128 for `generic`
  api_key: ""            # or PRIVYX_OPENAI_API_KEY / PRIVYX_ANTHROPIC_API_KEY
  headers: {}

# --- Audit ---
# PII-safe audit trail: one JSON object per line, appended to `path`.  Records
# entity *types* and *counts* (never payload content) plus request metadata.
# Separate from application logs (log_level / logging above).
audit:
  enabled: true
  path: privyx-audit.log   # or PRIVYX_AUDIT_PATH / PRIVYX_AUDIT_ENABLED

# Privyx configuration template
#
# Every setting is listed with its default value, commented out, so loading
# this file as it is changes nothing.  Copy it to ~/.privyx/config.yaml (or a
# project's privyx.yaml) and uncomment only what you want to change.
#
# Precedence: defaults < ~/.privyx/config.yaml < ~/.privyx/settings.yaml <
# trusted project files (privyx.yaml, .privyx/config.yaml, then
# .privyx/settings.yaml) < environment < CLI flags.  `privyx config set`
# writes the settings.yaml files; it never changes a file written by hand.
# Reference docs: docs/guide/configuration.md.
#
# Every setting has an environment variable: PRIVYX_ and its path with __
# between the names, such as PRIVYX_SERVER__PORT or PRIVYX_FEATURES__DIRECTIVE.
#
# Any value may be ${NAME} or ${NAME:-fallback}, read from the environment.
# Credential settings (api_key, secret, headers, env, ...) may also name a
# 1Password item (op://vault/item/field) or a keychain entry
# (keychain://service/account, privyx[keychain]).  Keep API keys out of this file.

# --- Other files ---
# Files or globs merged below this one, relative to it.
# include: []

# --- Server and logging ---
# server:
#   host: 127.0.0.1
#   port: 8000
#   workers: 1             # processes; more than one needs a sqlite file or redis vault
#   tls:                   # HTTPS when certfile and keyfile are set
#     certfile: ""
#     keyfile: ""
#     keyfile_password: ""
#     ca_certs: ""
#
# log:
#   level: info            # debug | info | warning | error
#   format: text           # console format: text | json
#   # Debug log file.  It also receives third-party logs at log.level.  At
#   # debug it holds raw vault rows (original values): it is created 0600,
#   # keep it local.  On POSIX, an existing file must belong to you with no
#   # permissions beyond 0600, or startup fails (fix with chmod 600).
#   file: ""

# --- Agent launch profiles (`privyx run NAME`) ---
# Built-in profiles: claude, codex, openai, aider, pi, opencode, gemini, ollama,
# and grok.  Override them field by field, add your own with `extends`, or add
# a variant named base:variant (claude:work inherits claude).  Each profile
# can set command, type, provider, upstream, env_vars, base_path, extends,
# args, env, env_from, budget (max_turns, max_tokens), presets (names from
# presets below), privyx (settings for that profile only), and the options of
# its type: env takes endpoint_env.  Without type, a profile has the one it
# extends, else the one named like it or its command, else env.  See
# configs/examples/agents.yaml.
# agents:
#
# Named sets of Privyx settings, applied by an agent profile's presets list or
# by `privyx --preset NAME`.  A preset takes any setting but agents,
# presets, include, provider, and providers.  Example:
# {strict: {proxy: {passthrough_unknown: false}}}
# presets: {}
#
# `privyx run`: also mask the workspace's git authors, remote owners, project
# names, .env values, and the local OS username, kept in memory (--harvest).
# OS usernames shorter than 3 characters and root/ubuntu/admin/user are skipped.
# harvest: false

# --- Provider ---
# Where requests go and which key they carry.  `provider` names one of
# `providers` below, or is a provider of its own (a mapping, as here).  A
# `privyx run` profile uses its own (agents.<name>.provider) instead, unless
# --provider picks one; PRIVYX_PROVIDER picks a name here.
#   URL  base_url (or PRIVYX_UPSTREAM_URL, --upstream), else the default for
#        the type (generic http://localhost:20128, openai api.openai.com,
#        anthropic api.anthropic.com, google generativelanguage.googleapis.com)
#   key  api_key (or PRIVYX_API_KEY); with none the transparent proxy relays
#        the client's own.  A key, or a header, goes only to the base_url of
#        the provider it is written for: Privyx refuses to start otherwise.
# provider:
#   type: generic          # generic | openai | anthropic | google
#   base_url: ""
#   api_key: ""
#   headers: {}            # extra headers on every upstream request
#   forward_client_auth: true   # false: drop the client's key and cookies, send only the provider's
#   # Transparent mode: origin sends a request path to the upstream's host,
#   # dropping the upstream URL's own path.  prefix keeps that path and appends
#   # the request path minus strip_prefix (`privyx run` strips the agent's
#   # base_path); other paths get 404.  prefix needs an explicit upstream URL.
#   path_mapping:
#     mode: origin         # origin | prefix
#     strip_prefix: ""     # e.g. /v1: /v1/chat/completions -> <upstream>/chat/completions
#   timeout: 300           # seconds between bytes, read or write
#   connect_timeout: 10
#   max_connections: null  # null: no limit
#
# Named providers, each with the settings above.  Built in: generic, openai,
# anthropic, google (each of its type), xai (openai, https://api.x.ai/v1), and
# ollama (generic, http://127.0.0.1:11434).  PRIVYX_OPENAI_API_KEY,
# PRIVYX_ANTHROPIC_API_KEY, and PRIVYX_GOOGLE_API_KEY are the keys of the
# built-in provider of that name.  Example:
# {work: {type: anthropic, base_url: https://router.example.com, api_key: "${WORK_TOKEN}"}}
# providers:

# --- Proxy ---
# proxy:
#   mode: transparent      # transparent | gateway
#   # Path -> wire schema of the requests Privyx masks.  A map given here
#   # replaces the 27 default paths (see docs/guide/proxy.md#routes).
#   routes:
#   passthrough_unknown: true   # false: paths not in routes get 403
#   dlp_check: true        # mask copies of masked values, refuse if one is left
#                          # exact signed thinking remembered from upstream is exempt
#   tap: false             # each masked exchange before and after masking; holds originals
#   tap_dir: ~/.privyx/tap

# --- Vault ---
# Where sessions and their mappings live.
# vault:
#   type: memory           # memory | sqlite (privyx[sqlite]) | redis (privyx[redis])
#   dsn: sqlite+aiosqlite:///~/.privyx/privyx.db  # sqlite
#   redis_url: redis://localhost:6379/0          # redis
#   ttl: null              # expire a session idle this many seconds; null keeps it

# --- Session ---
# How a request without an x-privyx-session header picks its session:
#   ephemeral     a fresh session per request
#   client        one session per client credential
#   conversation  one session per conversation (credential + first user message)
# `privyx run` uses conversation unless this is set.
# session:
#   strategy: ephemeral

# --- Detectors ---
# What counts as sensitive: the detectors, run in this order, their findings
# pooled.  An entry's type is its name unless it writes `type`, and `false`
# turns it off (`regex: false`), so a second regex detector is written
# `regex-2: {type: regex, ...}`.  The regex built-ins cover EMAIL, PHONE,
# CREDIT_CARD, IP_ADDRESS, SSN, API_KEY, JWT, PRIVATE_KEY, AUTH_TOKEN,
# URL_CREDENTIAL, SECRET, crypto wallets, and national IDs.  Each type uses
# only its own settings below, plus enabled, cache, and
# underscore_separates_words; Privyx refuses the others.
# detectors:
#   regex:
#     enabled: true
#     builtins: true       # false: only the patterns and terms below, and `enable`
#     # Entity -> regex, merged over the built-ins.  A (?P<value>...) group masks
#     # only that part.  Example, EMPLOYEE_ID: '\bEMP-\d{6}\b'
#     patterns: {}
#     # Entity -> literal strings, matched case-insensitively with word
#     # boundaries.  Example, PERSON: [ann, bob].  `privyx scan` writes here.
#     terms: {}
#     merge_terms: true    # match terms and patterns for the same entity, terms first
#     term_variants: true  # "Acme Corp" also matches acme-corp, acme_corp, ...
#     underscore_separates_words: true  # acme is found in ACME_API_KEY
#     # Entity -> words; a match counts only with one within five words.
#     context: {}
#     # Opt-in built-ins: HIGH_ENTROPY, ASSIGNED_SECRET, MRN, ICD10.  With
#     # builtins: false, also CRYPTO_WALLET, ID_NIK, ID_NPWP, SG_NRIC_FIN,
#     # MY_NRIC, ES_NIF, ES_NIE, UK_NHS, IN_AADHAAR, and IBAN.
#     enable: []
#     disable: []          # built-ins to turn off; inactive opt-in names are accepted too
#     entropy_threshold: 3.0  # HIGH_ENTROPY: bits per character
#     decode: false        # also scan split strings and Base64/hex/URL encoding
#     normalize: false     # also scan fullwidth and zero-width characters folded
#     cache:               # or true / false
#       enabled: true
#       max_size: 10000
#   presidio:              # privyx[presidio]
#     language: en
#     model: ""            # spaCy model; empty: {language}_core_web_sm
#     entities: []         # empty: every recognizer
#     score_threshold: 0.35
#   llm:
#     llm_provider: openai # openai | anthropic
#     llm_model: ""        # empty: a small default model per provider
#     llm_api_key: ""      # empty: the SDK's own environment variable
#     llm_instructions: "" # empty: the built-in prompt
#     llm_timeout: 30.0
#     llm_max_chars: 4000
#     llm_fallback_on_error: false  # true: built-in patterns when the LLM fails

# --- Policy ---
# Which detections are masked: default masks all, strict only `allowed`.
# policy:
#   type: default          # default | strict
#   allowed: []            # strict: empty means every built-in entity

# --- Operator ---
# What a detected value becomes.  Every type but redact is restored in replies.
# operator:
#   type: pseudonym        # pseudonym | hash | encrypt | faker | fpe | partial | redact
#   text: "[REDACTED]"     # redact: replacement text
#   id_length: 16          # pseudonym (anchored), encrypt, hash (default 12): id
#                          # hex characters, 6 to 64
#   locale: ""             # faker, pseudonym labels: Faker locale, such as en_US
#   seed: null             # faker, fpe: same value, same fake across runs; varies labels
#   key: ""                # encrypt: 64 hex chars (privyx[crypto]), or PRIVYX_ENCRYPT_KEY

# --- Anchor ---
# With a secret, the same value gets the same pseudonym in every session.
# `auto` creates or reuses ~/.privyx/anchor.key, shared by every command.
# Empty: a per-session counter; an explicitly empty PRIVYX_ANCHOR_SECRET too.
# anchor:
#   type: hmac
#   secret: auto           # or PRIVYX_ANCHOR_SECRET; `openssl rand -hex 32`

# --- Token syntax ---
# The format must contain {type} and {id}; {namespace} is optional.  Two
# other formats: "[[{namespace}:{type}:{id}]]" and "<{namespace}:{type}:{id}>".
# token:
#   namespace: PRIVYX
#   format: "<{namespace}_{type}_{id}>"
#   compact: false         # short tokens such as <E~1>; format tokens still restore
#   # pseudonym only, privyx[faker]: also a fake value for the model, such as
#   # <PRIVYX_PERSON_A81B3C9AEE08DE11:Alice Johnson>; restored by the id, never by the label.
#   label_format: ""       # needs {id} and {label}; empty is off

# --- Features ---
# Optional behavior, each on or off: `true`, `false`, or its options (on
# unless they say enabled: false).  `privyx features list` shows them, and
# `privyx features enable NAME` switches one on in ~/.privyx/settings.yaml.
# features:
#   # PII-safe trail: entity types and counts, never content, as JSON lines.
#   audit:
#     enabled: true
#     path: ~/.privyx/audit.log
#     # Model-id prefix -> USD per million tokens, for `privyx session show`.
#     # Example, claude-sonnet: {input: 3, output: 15}
#     prices: {}
#   metrics: true          # counters at GET /metrics
#   tracing: false         # OpenTelemetry spans (privyx[otel]; exporter set by OTEL_*)
#   directive: false       # tell the model to keep placeholders as written
#   cache_control: false   # mark a large Anthropic tools/system prefix for caching
#   # A `privyx run` profile's budget (agents.<name>.budget) switches it on.
#   budget:
#     max_turns: null
#     max_tokens: null
#     profile: ""          # the profile named in the audit trail and the refusal

# --- Plugins ---
# Directories or .py files, and modules (installed packages), whose setup(app)
# adds components that become selectable as a `type`.
# plugins:
#   enabled: true
#   paths: []
#   modules: []            # or PRIVYX_PLUGIN_MODULES, comma-separated
#
# Options of each secret resolver, by scheme: op:// and keychain:// take none,
# a plugin's may (secrets: {doppler: {project: acme}}).  A reference here or
# under plugins is not resolved: use ${NAME}.
# secrets: {}

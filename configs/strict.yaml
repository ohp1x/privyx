# Privyx strict configuration
#
# For higher-sensitivity work.  It changes only how strictly Privyx masks and
# forwards: the upstream, provider, and anchor stay as they would be without
# it, so `privyx run -c configs/strict.yaml claude` still reaches Anthropic.
# Every setting is listed in configs/default.yaml.

# Persist sessions in ~/.privyx/privyx.db across restarts (privyx[sqlite]).
vault:
  type: sqlite

# The default policy masks everything detected: the built-ins, your own
# `terms` and `patterns`, and what `privyx run --harvest` finds.
detector:
  type: regex
  patterns:
    DATE_OF_BIRTH: "\\b\\d{4}-\\d{2}-\\d{2}\\b"
  # Also find values split into strings or Base64/hex/URL encoded, and values
  # written in fullwidth letters or with zero-width characters inside.
  decode: true
  normalize: true

proxy:
  # Only routes with a masking schema may reach the upstream.  Other paths,
  # including models and files, return 403.
  passthrough_unknown: false
  # Refuse (422) a masked request that still holds a value it masked
  # somewhere Privyx does not mask, instead of forwarding it.  Left off: signed
  # thinking text must be sent back as the model wrote it, so a detected value
  # the model wrote there ends a Claude Code session.
  # dlp_check: true

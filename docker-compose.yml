services:
  privyx:
    build:
      context: .
      dockerfile: Dockerfile
    image: privyx:latest
    container_name: privyx
    restart: unless-stopped
    ports:
      # Loopback only: the proxy has no authentication of its own.
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    # The image's `privyx` applies these, matching a setting's names in any case:
    # FIXED_ over both names, DEFAULT_ only when neither is given.
    environment:
      # The published port is mapped to this one.
      - FIXED_PRIVYX_HOST=0.0.0.0
      - FIXED_PRIVYX_PORT=8000
      - DEFAULT_PRIVYX_VAULT=redis
      - DEFAULT_PRIVYX_REDIS_URL=redis://redis:6379/0
      # A conversation's session, with its original values, expires after a week idle.
      - DEFAULT_PRIVYX_VAULT_TTL=604800
      - DEFAULT_PRIVYX_SESSION_STRATEGY=conversation
      - DEFAULT_PRIVYX_LOG_LEVEL=info
      - DEFAULT_PRIVYX_AUDIT_ENABLED=true
      - PRIVYX_OPENAI_API_KEY=${PRIVYX_OPENAI_API_KEY:-}
      - PRIVYX_ANTHROPIC_API_KEY=${PRIVYX_ANTHROPIC_API_KEY:-}
      - PRIVYX_ENCRYPT_KEY=${PRIVYX_ENCRYPT_KEY:-}
      # Passed only when set, so an anchor.secret in a mounted config still applies.
      # Unset, the default `auto` keeps a key on the /data volume; empty: no anchor.
      - PRIVYX_ANCHOR_SECRET
      # Passed only when set, so the shell's value wins over the one in .env.
      # Where requests go: the upstream, or a built-in provider.  Without either,
      # they go to http://localhost:20128, the container itself.
      - PRIVYX_UPSTREAM_URL
      - PRIVYX_PROVIDER
      - PRIVYX_PROVIDER__BASE_URL
      - PRIVYX_VAULT
      - PRIVYX_VAULT__TYPE
      - PRIVYX_REDIS_URL
      - PRIVYX_VAULT__REDIS_URL
      - PRIVYX_VAULT_DSN
      - PRIVYX_VAULT__DSN
      - PRIVYX_VAULT_TTL
      - PRIVYX_VAULT__TTL
      - PRIVYX_SESSION_STRATEGY
      - PRIVYX_SESSION__STRATEGY
      - PRIVYX_LOG_LEVEL
      - PRIVYX_LOG__LEVEL
      - PRIVYX_AUDIT_ENABLED
      - PRIVYX_FEATURES__AUDIT__ENABLED
      - PRIVYX_AUDIT_PATH
      - PRIVYX_FEATURES__AUDIT__PATH
    volumes:
      - privyx_data:/data
      - ./configs:/app/configs:ro
      - ./plugins:/app/plugins:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: privyx-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-127.0.0.1:16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 1s

volumes:
  privyx_data:
  redis_data:
